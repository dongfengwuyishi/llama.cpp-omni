[pytest]
testpaths = tests
addopts = -ra -q --strict-markers
asyncio_mode = auto

markers =
    unit:        Pure-logic unit tests, no network, no model.
    integration: Integration tests using the in-process mock worker (no GPU needed).
    e2e:         End-to-end tests against a real worker (requires GPU + model). Skipped by default.
    slow:        Long-running tests; opt-in.
